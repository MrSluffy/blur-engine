name: Publish

# Runs when a release tag (v1.0.0, v1.1.0, ...) is pushed, or manually.
#
#   verify           tag matches VERSION_NAME, license headers, ./gradlew check
#   maven-central    signed upload to the Central Portal. With mavenCentralAutomaticPublishing=false
#                    (gradle.properties) it waits there until someone clicks "Publish".
#   github-packages  the same signed artifacts to GitHub Packages (tags only)
#   github-release   a GitHub Release with the CHANGELOG notes and the showcase APK (tags only)
#
# Signing keys and Central credentials are secrets of the `maven-central` environment.
# GitHub Packages uses the workflow's own GITHUB_TOKEN.
#
# Only the repository owner can release: `verify` fails for anyone else. Pair it with the
# repository settings in RELEASING.md (a tag ruleset for v* and a required reviewer on the
# `maven-central` environment), which stop the tag and the secrets at GitHub's side as well.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false # never cancel a half-finished upload

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      # Every other job needs this one, so nothing is built, signed or uploaded unless the
      # repository owner pushed the tag (or started the run) and, for re-runs, also re-ran it.
      # A passphrase input would not help: inputs are visible to anyone who can read the run.
      - name: Only the repository owner can release
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$ACTOR" != "$OWNER" ] || [ "$TRIGGERING_ACTOR" != "$OWNER" ]; then
            echo "::error::Releases can only be started by $OWNER (actor: $ACTOR, triggered by: $TRIGGERING_ACTOR)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - run: chmod +x gradlew
      - name: Check the tag matches VERSION_NAME
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != v$version"; exit 1; }
      # Never release sources without license headers.
      - name: Check Apache license headers
        run: ./gradlew spotlessCheck
      - run: ./gradlew check

  maven-central:
    name: Maven Central
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: maven-central
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - run: chmod +x gradlew
      - name: Publish to Maven Central
        run: ./gradlew publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

  # A version can only be uploaded once to GitHub Packages, so this runs for tags only.
  github-packages:
    name: GitHub Packages
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: maven-central # for the signing key
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - run: chmod +x gradlew
      - name: Publish to GitHub Packages
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_GitHubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_GitHubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

  github-release:
    name: GitHub Release
    needs: [maven-central, github-packages]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - run: chmod +x gradlew
      - name: Build the showcase APK
        run: |
          ./gradlew :blur-showcase:assembleDebug
          cp blur-showcase/build/outputs/apk/debug/blur-showcase-debug.apk "blur-showcase-${GITHUB_REF_NAME}.apk"
      # The section of CHANGELOG.md under "## <version>", up to the next "## " heading.
      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 == "## " v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No '## $version' section in CHANGELOG.md"; exit 1; }
          {
            echo
            echo "## Install"
            echo
            echo '```kotlin'
            echo "implementation(\"io.github.mrsluffy:blur-view:$version\")     // Android Views"
            echo "implementation(\"io.github.mrsluffy:blur-compose:$version\")  // Jetpack Compose"
            echo '```'
            echo
            echo "\`blur-showcase-${GITHUB_REF_NAME}.apk\` is the demo app (a debug build; Android 10+)."
          } >> notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            $prerelease \
            "blur-showcase-${GITHUB_REF_NAME}.apk"
