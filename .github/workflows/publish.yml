name: Publish

# Runs when a release tag (v1.0.0, v1.1.0, ...) is pushed, or manually.
# Uploads signed artifacts to the Maven Central Portal. With SONATYPE_AUTOMATIC_RELEASE=false
# (gradle.properties) the deployment waits in the Portal until someone clicks "Publish" there.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: maven-central
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-read-only: true
      - run: chmod +x gradlew
      - name: Check the tag matches VERSION_NAME
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != v$version"; exit 1; }
      # Never release sources without license headers.
      - name: Check Apache license headers
        run: ./gradlew spotlessCheck
      - run: ./gradlew check
      - name: Publish to Maven Central
        run: ./gradlew publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
