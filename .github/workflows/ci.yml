name: CI

on:
  push:
    branches: [main, development]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  license-headers:
    name: License headers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: chmod +x gradlew
      # Fails if any Kotlin, Gradle or XML source file lacks the Apache 2.0 header.
      # Fix locally with `./gradlew spotlessApply` and commit the result.
      - name: Check Apache license headers
        run: ./gradlew spotlessCheck

  build:
    name: Build, lint, unit tests, API check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # gradlew is committed without the executable bit.
      - run: chmod +x gradlew
      # License headers are checked in their own job (license-headers).
      # check = lint + JVM unit tests + apiCheck (fails if the public API changed without `apiDump`).
      - run: ./gradlew check assembleDebug dokkaHtmlMultiModule --continue
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: '**/build/reports/'
          retention-days: 7

  device-tests:
    name: Device tests (API ${{ matrix.api }})
    needs: [license-headers, build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 29: GLES path (Android 10). 34: RenderEffect path (Android 14).
        api: [29, 34]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: chmod +x gradlew
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run device tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.api == 29 && 'default' || 'google_apis' }}
          arch: x86_64
          # The tests lay out a fixed 600x400 px view; the default AVD screen is too small for it,
          # which put the view off-screen (negative x in getPixel).
          profile: pixel_5
          ram-size: 3072M
          # Screenshot tests need a real GPU path; swiftshader is the software GL on CI hosts.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          # One module at a time: the tests are screenshot-sensitive. Frame-rate checks are off,
          # because swiftshader is software GL and can't hold frame rates; correctness checks still run.
          script: |
            sleep 60
            ./gradlew :blur-platform:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.timingAssertions=false
            ./gradlew :blur-view:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.timingAssertions=false
            ./gradlew :blur-compose:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.timingAssertions=false
      - name: Upload device test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-tests-api-${{ matrix.api }}
          path: '**/build/outputs/androidTest-results/'
          retention-days: 7
