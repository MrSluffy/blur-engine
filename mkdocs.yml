site_name: Blur Engine
site_description: Real-time background blur, liquid glass and progressive blur for Android Views and Jetpack Compose.
site_author: MrSluffy
site_url: https://mrsluffy.github.io/blur-engine/
repo_url: https://github.com/MrSluffy/blur-engine
repo_name: MrSluffy/blur-engine
edit_uri: edit/HEAD/docs/
copyright: Copyright &copy; 2026 MrSluffy. Apache License 2.0.

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: pink
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: pink
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.tabs.link
    - search.highlight

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guide:
      - Views: views.md
      - Compose: compose.md
      - Effects: effects.md
      - Animation: animation.md
      - Recipes: recipes.md
  - Reference:
      - How it works: how-it-works.md
      - Performance: performance.md
      - Limitations and troubleshooting: limitations.md
  - Changelog: changelog.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      # CHANGELOG.md and CONTRIBUTING.md live at the repository root.
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
